name: Test du relais pour les vocaux (temporaire)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Envoie un faux vocal et teste son téléchargement depuis un navigateur
        run: |
          T="rdv-diag-$RANDOM$RANDOM"
          head -c 200000 /dev/urandom > vocal.bin
          echo "== envoi (pièce jointe) =="
          R=$(curl -s -X POST --data-binary @vocal.bin "https://ntfy.sh/$T?filename=vocal.bin&message=test")
          echo "$R"
          URL=$(echo "$R" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("attachment",{}).get("url",""))')
          echo "URL=$URL"
          echo "== en-têtes du fichier, demandé par le site =="
          curl -s -D - -o /dev/null -H "Origin: https://eezoua19.github.io" "$URL"
          echo "== pré-vérification CORS =="
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://eezoua19.github.io" -H "Access-Control-Request-Method: GET" "$URL"
          echo "== message tel que lu par l'admin =="
          curl -s "https://ntfy.sh/$T/json?poll=1&since=all"
